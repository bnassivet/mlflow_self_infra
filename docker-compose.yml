services:
  # PostgreSQL database for MLflow metadata
  postgres:
    image: postgres:15-alpine
    container_name: mlflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow123}
    volumes:
      - ~/volumes/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - mlflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for artifact storage
  minio:
    image: minio/minio:latest
    container_name: mlflow-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    command: server /data --console-address ":9001"
    volumes:
      - ~/volumes/minio:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"     # MinIO API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # MinIO Console
    networks:
      - mlflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create MinIO bucket for MLflow
  minio-setup:
    image: minio/mc:latest
    container_name: mlflow-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mlflow-network
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio123};
      /usr/bin/mc mb myminio/${MINIO_BUCKET:-mlflow} --ignore-existing;
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET:-mlflow};
      exit 0;
      "

  # MLflow DB backup + schema migration — opt-in via: docker compose --profile migrate up
  mlflow-migrate:
    image: python:3.12-slim
    container_name: mlflow-migrate
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URI: postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow123}@postgres:5432/${POSTGRES_DB:-mlflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:-mlflow123}
    volumes:
      - ~/volumes/postgres-backups:/backups
    networks:
      - mlflow-network
    restart: "no"
    command: >
      /bin/sh -c "
      apt-get update -qq && apt-get install -y -qq postgresql-client &&
      pip install -q '${MLFLOW_VERSION:-mlflow[genai]>=3.10.0}' psycopg2-binary &&
      BACKUP_FILE=/backups/mlflow_pre_upgrade_$$(date +%Y%m%d_%H%M%S).dump &&
      echo '>>> [1/3] Creating database backup...' &&
      pg_dump -h postgres -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow} -Fc -f \$$BACKUP_FILE &&
      echo \">>> [2/3] Backup saved at: \$$BACKUP_FILE\" &&
      echo '>>> [3/3] Running MLflow schema migration...' &&
      mlflow db upgrade \$$DB_URI &&
      echo '>>> Migration complete. Backup retained at: '\$$BACKUP_FILE
      "

  # MLflow server
  mlflow:
    image: python:3.12-slim
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      # PostgreSQL connection
      DB_URI: postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow123}@postgres:5432/${POSTGRES_DB:-mlflow}
      # MinIO connection
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      # GenAI API keys (loaded from .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://host.docker.internal:1234/v1}
      # GenAI evaluation configuration
      MLFLOW_GENAI_EVAL_MAX_WORKERS: ${MLFLOW_GENAI_EVAL_MAX_WORKERS:-10}
      MLFLOW_GENAI_EVAL_ASYNC_TIMEOUT: ${MLFLOW_GENAI_EVAL_ASYNC_TIMEOUT:-300}
    ports:
      - "${MLFLOW_PORT:-5010}:5000"
    networks:
      - mlflow-network
    command: >
      /bin/sh -c "
      pip install '${MLFLOW_VERSION:-mlflow[genai]>=3.10.0}' psycopg2-binary boto3 openai anthropic litellm langchain langchain-openai langchain-community dspy -U &&
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow123}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination s3://${MINIO_BUCKET:-mlflow}/
      --serve-artifacts
      --host ${MLFLOW_HOST:-0.0.0.0}
      --port 5000
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3


networks:
  mlflow-network:
    driver: bridge
