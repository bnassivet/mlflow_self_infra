services:
  # PostgreSQL database for MLflow metadata
  postgres:
    image: postgres:15-alpine
    container_name: mlflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow123}
    volumes:
      - ~/volumes/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - mlflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RustFS for artifact storage (MinIO-compatible S3 engine)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: mlflow-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:-rustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:-rustfs123}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    command: /data
    volumes:
      - ~/volumes/rustfs:/data
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"     # S3 API
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001" # Console
    networks:
      - mlflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create the artifact bucket in RustFS (uses the minio/mc S3 client tool)
  rustfs-setup:
    image: minio/mc:latest
    container_name: mlflow-rustfs-setup
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - mlflow-network
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set rustfs http://rustfs:9000 ${RUSTFS_ROOT_USER:-rustfs} ${RUSTFS_ROOT_PASSWORD:-rustfs123};
      /usr/bin/mc mb rustfs/${RUSTFS_BUCKET:-mlflow} --ignore-existing;
      /usr/bin/mc anonymous set download rustfs/${RUSTFS_BUCKET:-mlflow} || true;
      exit 0;
      "

  # MLflow DB backup + schema migration — opt-in via: docker compose --profile migrate up
  mlflow-migrate:
    image: python:3.12-slim
    container_name: mlflow-migrate
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URI: postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow123}@postgres:5432/${POSTGRES_DB:-mlflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:-mlflow123}
    volumes:
      - ~/volumes/postgres-backups:/backups
    networks:
      - mlflow-network
    restart: "no"
    command: >
      /bin/sh -c "
      apt-get update -qq && apt-get install -y -qq postgresql-client &&
      pip install -q '${MLFLOW_VERSION:-mlflow[genai]>=3.10.0}' psycopg2-binary &&
      BACKUP_FILE=/backups/mlflow_pre_upgrade_$$(date +%Y%m%d_%H%M%S).dump &&
      echo '>>> [1/3] Creating database backup...' &&
      pg_dump -h postgres -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow} -Fc -f \$$BACKUP_FILE &&
      echo \">>> [2/3] Backup saved at: \$$BACKUP_FILE\" &&
      echo '>>> [3/3] Running MLflow schema migration...' &&
      mlflow db upgrade \$$DB_URI &&
      echo '>>> Migration complete. Backup retained at: '\$$BACKUP_FILE
      "

  # MLflow server
  mlflow:
    image: python:3.12-slim
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-setup:
        condition: service_completed_successfully
    environment:
      # PostgreSQL connection
      DB_URI: postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow123}@postgres:5432/${POSTGRES_DB:-mlflow}
      # RustFS (S3) connection
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://rustfs:9000}
      AWS_ACCESS_KEY_ID: ${RUSTFS_ROOT_USER:-rustfs}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_ROOT_PASSWORD:-rustfs123}
      # GenAI API keys (loaded from .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://host.docker.internal:1234/v1}
      # GenAI evaluation configuration
      MLFLOW_GENAI_EVAL_MAX_WORKERS: ${MLFLOW_GENAI_EVAL_MAX_WORKERS:-10}
      MLFLOW_GENAI_EVAL_ASYNC_TIMEOUT: ${MLFLOW_GENAI_EVAL_ASYNC_TIMEOUT:-300}
      # MLflow Assistant: the assistant API is localhost-only by default, and Docker's
      # port proxy makes the browser look remote (client IP is the bridge gateway, never
      # 127.0.0.1). Enabling this lets remote clients through, but only for providers that
      # declare allows_remote_access — in practice the "MLflow AI Gateway" provider.
      # Ollama / raw OpenAI-compatible providers stay blocked regardless of this flag.
      MLFLOW_ENABLE_REMOTE_ASSISTANT: ${MLFLOW_ENABLE_REMOTE_ASSISTANT:-true}
      # Encrypts AI Gateway secrets (LLM Connections) at rest in Postgres. MLflow falls
      # back to a well-known default passphrase when unset, which anyone with DB access
      # can decrypt. Set a high-entropy value in .env.
      MLFLOW_CRYPTO_KEK_PASSPHRASE: ${MLFLOW_CRYPTO_KEK_PASSPHRASE:-}
    volumes:
      # Assistant config (selected provider, model, permissions) lives in
      # $HOME/.mlflow/assistant inside the container; persist it across recreates.
      - ~/volumes/mlflow-assistant:/root/.mlflow/assistant
      # Server-side assistant setup helper (see scripts/setup_assistant.py)
      - ./scripts:/scripts:ro
    ports:
      # Bound to 127.0.0.1 deliberately: the in-container socat relay (see command below)
      # makes every request look like it comes from loopback, which unlocks the
      # assistant's privileged routes (PUT /config, skills install). Those are
      # remote-code-execution surfaces, so the port must not be reachable from the
      # network. Publishing this on 0.0.0.0 while the relay runs would hand full
      # assistant access to anyone who can route here.
      #
      # Published and internal ports are also kept identical on purpose: the assistant
      # builds its self-call URL to the in-server AI Gateway from the browser's Host
      # header (get_server_base_url in mlflow/server/asgi_utils.py), so a host port that
      # differs from the listening port makes the server dial a port nothing is bound to.
      - "127.0.0.1:${MLFLOW_PORT:-5010}:${MLFLOW_PORT:-5010}"
    networks:
      - mlflow-network
    # Loopback relay for the MLflow Assistant, run inside this container.
    #
    # The assistant refuses its privileged routes to any non-loopback peer, and Docker's
    # port proxy rewrites the source address, so the browser always looks remote and the
    # endpoint dropdown / settings Save button return 403 (see README).
    #
    # So MLflow binds loopback-only on MLFLOW_INTERNAL_PORT and socat relays the
    # published port to it, making uvicorn see a genuine 127.0.0.1 peer. socat runs here
    # rather than in a sidecar on purpose: a sidecar sharing this container's network
    # namespace is stranded whenever mlflow restarts (MLflow reports healthy while the
    # published port answers nothing), and compose cannot order that restart correctly.
    #
    # It is a raw TCP relay, NOT an HTTP proxy: it adds no X-Forwarded-For, which matters
    # because uvicorn trusts that header from 127.0.0.1 and would otherwise rewrite the
    # client back to the real remote address (see mlflow/server/assistant/api.py).
    #
    # Only safe because the published port is bound to 127.0.0.1 above. Together they
    # restore MLflow's intended "same host only" guarantee rather than bypassing it. To
    # reach this server from another machine, drop the relay, bind --host 0.0.0.0, and
    # switch assistant endpoints with scripts/setup_assistant.py instead.
    #
    # MLFLOW_INTERNAL_PORT must differ from MLFLOW_PORT or socat and MLflow collide.
    command: >
      /bin/sh -c "
      set -e;
      apt-get update -qq;
      apt-get install -y -qq --no-install-recommends socat;
      pip install '${MLFLOW_VERSION:-mlflow[genai]>=3.10.0}' psycopg2-binary boto3 openai anthropic litellm langchain langchain-openai langchain-community dspy -U;
      socat TCP-LISTEN:${MLFLOW_PORT:-5010},fork,reuseaddr TCP:127.0.0.1:${MLFLOW_INTERNAL_PORT:-5000} &
      exec mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow123}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination s3://${MINIO_BUCKET:-mlflow}/
      --serve-artifacts
      --host 127.0.0.1
      --port ${MLFLOW_INTERNAL_PORT:-5000}
      "
    healthcheck:
      # python:3.12-slim has no curl; use the bundled Python instead. Probes through the
      # socat relay, not MLflow's listener directly, so a dead relay shows as unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${MLFLOW_PORT:-5010}/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s


networks:
  mlflow-network:
    driver: bridge
