[project]
name = "mlflow-testing"
version = "0.1.0"
description = "Testing environment for MLflow Docker Compose setups"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Bruno Nassivet" }
]

dependencies = [
    # MLflow with GenAI support
    "mlflow[genai]>=3.6.0",

    # S3/MinIO support (for local testing)
    "boto3>=1.34.0",

    # Machine Learning libraries
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",

    # LLM Provider SDKs
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "litellm>=1.0.0",

    # LangChain for GenAI features
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.1.0",

    # Additional utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# AWS-specific dependencies for production S3 testing
aws = [
    "awscli>=1.32.0",
    "boto3>=1.34.0",
]

# Development dependencies
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

# Full installation with all optional dependencies
all = [
    "mlflow-testing[aws,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=. --cov-report=term-missing"
