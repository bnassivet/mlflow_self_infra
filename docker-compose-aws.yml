version: '3.8'

services:
  # PostgreSQL database for MLflow metadata
  postgres:
    image: postgres:15-alpine
    container_name: mlflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow123}
    volumes:
      - ~/volumes/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - mlflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MLflow DB backup + schema migration — opt-in via: docker compose --profile migrate up
  mlflow-migrate:
    image: python:3.12-slim
    container_name: mlflow-migrate
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URI: postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow123}@postgres:5432/${POSTGRES_DB:-mlflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:-mlflow123}
    volumes:
      - ~/volumes/postgres-backups:/backups
    networks:
      - mlflow-network
    restart: "no"
    command: >
      /bin/sh -c "
      apt-get update -qq && apt-get install -y -qq postgresql-client &&
      pip install -q '${MLFLOW_VERSION:-mlflow[genai]>=3.10.0}' psycopg2-binary &&
      BACKUP_FILE=/backups/mlflow_pre_upgrade_$$(date +%Y%m%d_%H%M%S).dump &&
      echo '>>> [1/3] Creating database backup...' &&
      pg_dump -h postgres -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow} -Fc -f \$$BACKUP_FILE &&
      echo \">>> [2/3] Backup saved at: \$$BACKUP_FILE\" &&
      echo '>>> [3/3] Running MLflow schema migration...' &&
      mlflow db upgrade \$$DB_URI &&
      echo '>>> Migration complete. Backup retained at: '\$$BACKUP_FILE
      "

  # MLflow server with AWS S3
  mlflow:
    image: python:3.12-slim
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # PostgreSQL connection
      DB_URI: postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow123}@postgres:5432/${POSTGRES_DB:-mlflow}
      # AWS credentials - REPLACE THESE WITH YOUR ACTUAL VALUES
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Optional: Use specific S3 endpoint (for non-standard regions or S3-compatible services)
      # AWS_S3_ENDPOINT_URL: https://s3.us-west-2.amazonaws.com
      # GenAI API keys (loaded from .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://host.docker.internal:1234/v1}
      # GenAI evaluation configuration
      MLFLOW_GENAI_EVAL_MAX_WORKERS: ${MLFLOW_GENAI_EVAL_MAX_WORKERS:-10}
      MLFLOW_GENAI_EVAL_ASYNC_TIMEOUT: ${MLFLOW_GENAI_EVAL_ASYNC_TIMEOUT:-300}
    ports:
      - "${MLFLOW_PORT:-5010}:5000"
    networks:
      - mlflow-network
    command: >
      /bin/sh -c "
      pip install '${MLFLOW_VERSION:-mlflow[genai]>=3.6.0}' psycopg2-binary boto3 openai anthropic litellm langchain langchain-openai langchain-community &&
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow123}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination s3://${MLFLOW_S3_BUCKET}/mlflow-artifacts/
      --serve-artifacts
      --host ${MLFLOW_HOST:-0.0.0.0}
      --port 5000
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mlflow-network:
    driver: bridge
