version: '3.8'

services:
  # MLflow server with SQLite metadata + local volume artifact storage
  mlflow:
    image: python:3.12-slim
    container_name: mlflow-server-light
    environment:
      # GenAI API keys (loaded from .env file)
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://host.docker.internal:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # GenAI evaluation configuration
      MLFLOW_GENAI_EVAL_MAX_WORKERS: ${MLFLOW_GENAI_EVAL_MAX_WORKERS:-10}
      MLFLOW_GENAI_EVAL_ASYNC_TIMEOUT: ${MLFLOW_GENAI_EVAL_ASYNC_TIMEOUT:-300}
      # MLflow Assistant: the assistant API is localhost-only by default, and Docker's
      # port proxy makes the browser look remote (client IP is the bridge gateway, never
      # 127.0.0.1). Enabling this lets remote clients through, but only for providers that
      # declare allows_remote_access — in practice the "MLflow AI Gateway" provider.
      # Ollama / raw OpenAI-compatible providers stay blocked regardless of this flag.
      MLFLOW_ENABLE_REMOTE_ASSISTANT: ${MLFLOW_ENABLE_REMOTE_ASSISTANT:-true}
      # Same URI as --backend-store-uri below. `mlflow server` gets its store from the
      # CLI flag, but `docker compose exec` inherits no tracking URI and would fall back
      # to a throwaway SQLite file, so scripts/setup_assistant.py reads this instead.
      DB_URI: sqlite:////mlflow/db/mlflow.db
      # Encrypts AI Gateway secrets (LLM Connections) at rest in the SQLite store. MLflow
      # falls back to a well-known default passphrase when unset, which anyone with file
      # access can decrypt. Set a high-entropy value in .env.
      MLFLOW_CRYPTO_KEK_PASSPHRASE: ${MLFLOW_CRYPTO_KEK_PASSPHRASE:-}
    volumes:
      - ~/volumes/mlflow-light:/mlflow
      # Assistant config (selected provider, model, permissions) lives in
      # $HOME/.mlflow/assistant inside the container; persist it across recreates.
      - ~/volumes/mlflow-light/assistant:/root/.mlflow/assistant
      # Server-side assistant setup helper (see scripts/setup_assistant.py)
      - ./scripts:/scripts:ro
    ports:
      # Published and internal ports are kept identical on purpose. The assistant builds
      # its self-call URL to the in-server AI Gateway from the browser's Host header
      # (get_server_base_url in mlflow/server/asgi_utils.py), so a host port that differs
      # from the container's listen port makes the server dial a port it isn't bound to.
      - "${MLFLOW_PORT:-5010}:${MLFLOW_PORT:-5010}"
    command: >
      /bin/sh -c "
      pip install '${MLFLOW_VERSION:-mlflow[genai]>=3.10.0}' openai anthropic litellm langchain langchain-openai langchain-community dspy -U &&
      mlflow server
      --backend-store-uri sqlite:////mlflow/db/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port ${MLFLOW_PORT:-5010}
      "
    healthcheck:
      # python:3.12-slim has no curl; use the bundled Python instead
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${MLFLOW_PORT:-5010}/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
